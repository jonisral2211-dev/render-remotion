# Render remoto gratuito del MODO B (flow_remotion) en un runner Ubuntu de GitHub (4 vCPU / 16 GB).
# Disparo: manual (workflow_dispatch con el nombre de la carpeta del proyecto) o push a una rama `render/<proyecto>`.
# Espera en el repo: remotion-studio/ (código + public/jobs/<proyecto>/ con media y audio) y render_jobs/<proyecto>/props.json.
name: render-remotion

on:
  workflow_dispatch:
    inputs:
      proyecto:
        description: "Nombre de la carpeta del proyecto (render_jobs/<proyecto>/props.json)"
        required: true
        type: string
      commitear:
        description: "Además del Artifact, commitear el .mp4 en renders_finales/"
        required: false
        type: boolean
        default: false
  push:
    branches: ["render/**"]

permissions:
  contents: write

concurrency:
  group: render-${{ github.ref }}-${{ inputs.proyecto }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      PROYECTO: ${{ inputs.proyecto || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolver proyecto
        run: |
          if [ -z "$PROYECTO" ]; then PROYECTO="${GITHUB_REF_NAME#render/}"; fi
          test -f "render_jobs/$PROYECTO/props.json" || { echo "::error::falta render_jobs/$PROYECTO/props.json"; exit 1; }
          echo "PROYECTO=$PROYECTO" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: remotion-studio/package-lock.json

      - name: Instalar FFmpeg y librerías de Chromium
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 \
            libpango-1.0-0 libcairo2 fonts-liberation

      - name: Dependencias de Remotion
        working-directory: remotion-studio
        run: npm ci

      - name: Render (concurrency=3)
        working-directory: remotion-studio
        run: |
          mkdir -p ../renders_finales
          npx remotion render src/index.ts Main "../renders_finales/${PROYECTO}.mp4" \
            --props="../render_jobs/${PROYECTO}/props.json" \
            --codec=h264 --gl=swangle --concurrency=3 --log=info

      - name: Verificar salida
        run: |
          ls -lh "renders_finales/${PROYECTO}.mp4"
          ffprobe -v error -show_entries format=duration -of default=nw=1 "renders_finales/${PROYECTO}.mp4"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROYECTO }}
          path: renders_finales/${{ env.PROYECTO }}.mp4
          retention-days: 14
          if-no-files-found: error

      - name: Commitear el .mp4 en renders_finales/ (opcional)
        if: ${{ inputs.commitear }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "renders_finales/${PROYECTO}.mp4"
          git commit -m "render: ${PROYECTO}"
          git push
